name: Docs site (docs.qcloud.systems)

# Checks the MkDocs knowledge base in docs-site/. Publishing is done by
# Cloudflare Pages, which builds docs-site/ on its own; see docs-site/README.md.
# The info.qcloud.systems deploy (deploy.yml) is unaffected.

on:
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # --strict fails on broken links and missing nav pages; the secret_scan
      # hook fails on anything that looks like a credential.
      - name: Build
        run: mkdocs build --strict
