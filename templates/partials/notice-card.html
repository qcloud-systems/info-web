{{define "notice-card"}}
<div class="project-card notice-card" data-slug="{{.Slug}}">
  <h3><a href="/notices/{{.Slug}}.html">{{.Title}}</a></h3>
  <p>{{.Description}}</p>
  {{if or .Categories (not .Updated.IsZero) -}}
  <p class="notice-meta">
    {{- if not .Updated.IsZero}}<time datetime="{{.Updated.Format "2006-01-02"}}">Updated {{.Updated.Format "Jan 2, 2006"}}</time>{{end}}
    {{- range .Categories}} <a href="/notices/categories/{{.Slug}}.html" class="category-chip category-chip-sm">{{.Name}}</a>{{end}}
  </p>
  {{end -}}
  <a href="/notices/{{.Slug}}.html" class="btn-primary">Read Note &rarr;</a>
</div>
{{end}}
